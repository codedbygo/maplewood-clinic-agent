[project]
name = "clinic-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1.0",
    "httpx2>=2.16.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agent", "clinic_mcp", "console", "eval"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise RuntimeError\\(\"unreachable\"\\)"]
